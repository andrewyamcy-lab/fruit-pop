name: Validate Firestore Rules
on:
  push:
    paths:
      - firestore.rules
      - .github/workflows/validate-firestore-rules.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI
        run: npm install --no-save firebase-tools@15.34.0
      - name: Compile Firestore security rules in local emulator
        run: |
          echo '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":18888},"ui":{"enabled":false}}}' > firebase.json
          ./node_modules/.bin/firebase emulators:exec --project demo-friendarcade --only firestore 'node -e "console.log(\"Firestore rules loaded successfully\")"'
